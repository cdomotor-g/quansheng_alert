name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Weekly, so a MegaNet station-data change reaches the firmware, the published
  # binaries and the web installer without anyone asking.
  schedule:
    - cron: '0 20 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi python3-crcmod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser for the installer test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The default build: stations.filter, full feature set. No --meganet-dir,
      # so the generator fetches cdomotor-g/MegaNet@main over the network and a
      # change there shows up as a diff in the committed header.
      #
      # VERSION_STRING is a hash of the sources rather than the git commit, so a
      # push that only touches documentation or CI rebuilds to a byte-identical
      # image and does not churn the binaries committed for the installer.
      - name: Build the default variant
        run: |
          python3 tools/gen_stations.py --provenance-out /tmp/stations-default.json
          make -j VERSION_STRING="$(tools/srcid.sh)"
          arm-none-eabi-size firmware
          python3 tools/publish_firmware.py \
            --provenance /tmp/stations-default.json \
            --variant default \
            --title "Default — Mt Kanigan and neighbours" \
            --description "Wide Bay / Burnett and central Queensland: Mt Kanigan, Mt Glorious, Barcaldine." \
            --order 10

      # South-East Queensland needs a bigger station table, so the flashlight and
      # the RSSI bar come out to make room.
      - name: Build the South-East Queensland variant
        run: |
          python3 tools/gen_stations.py --filter filters/constitution-hill.filter --max-bytes 7000 \
            --provenance-out /tmp/stations-seq.json
          make clean && make -j ENABLE_FLASHLIGHT=0 ENABLE_RSSI_BAR=0 VERSION_STRING="$(tools/srcid.sh)"
          arm-none-eabi-size firmware
          python3 tools/publish_firmware.py \
            --provenance /tmp/stations-seq.json \
            --variant constitution-hill \
            --title "South-East Queensland" \
            --description "The Constitution Hill network: Brisbane, Ipswich, Logan, Gold and Sunshine Coasts." \
            --order 20

      # Put the default station table back so that is what gets committed and
      # what the host tests run against.
      - name: Restore the default station table
        run: |
          python3 tools/gen_stations.py
          make clean && make -j VERSION_STRING="$(tools/srcid.sh)"

      - name: Host tests
        run: |
          make -C test
          node test/test_k5protocol.mjs
          node test/test_installer.mjs

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: quansheng-alert-${{ github.sha }}
          path: |
            docs/firmware/*.packed.bin
            docs/firmware/*.bin
            docs/firmware/manifest.json
          if-no-files-found: error

      # Keep main carrying the binaries the web installer serves, so GitHub Pages
      # can hand them straight to the browser with nothing to download by hand.
      - name: Commit the published firmware and station table
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule')
        run: |
          # manifest.json carries a build timestamp, so it always differs. Only
          # commit when the firmware or the station table actually changed;
          # otherwise throw the timestamp away and leave main alone.
          if [ -z "$(git status --porcelain -- 'docs/firmware/*.bin' app/alert_stations_gen.h)" ]; then
            echo "Firmware unchanged - nothing to publish."
            git checkout -- docs/firmware/manifest.json || true
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware app/alert_stations_gen.h
          git commit -m "Publish firmware for the web installer"
          git push origin HEAD:main

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docs/firmware/quansheng-alert-default.packed.bin
            docs/firmware/quansheng-alert-constitution-hill.packed.bin
          fail_on_unmatched_files: true
